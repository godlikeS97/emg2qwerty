# @package _global_
module:
  _target_: emg2qwerty.lightning.TransformerCTCModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384]
  d_model: 384  # Transformer hidden dimension
  nhead: 8  # Number of attention heads
  num_encoder_layers: 6  # Number of transformer encoder layers
  dim_feedforward: 1024  # Dimension of FFN in transformer
  dropout: 0.1
  activation: "gelu"  # Using GELU activation instead of ReLU
  max_seq_length: 1000  # Increased from 500 to handle longer sequences

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context 