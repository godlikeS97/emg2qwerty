# @package _global_
module:
  _target_: emg2qwerty.lightning.TransformerCTCModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384]
  d_model: 256  # Reduced from 384 for faster training and less overfitting
  nhead: 4      # Reduced number of attention heads for better generalization
  num_encoder_layers: 3  # Fewer layers to prevent overfitting
  dim_feedforward: 1024
  dropout: 0.2  # Increased dropout for better regularization
  activation: "gelu"  # Better activation for transformers
  max_seq_length: 1000  # Keep max sequence length for handling longer sequences
  norm_first: True  # Use pre-normalization for better stability

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context 