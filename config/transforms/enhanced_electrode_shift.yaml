# @package _global_
to_tensor:
  _target_: emg2qwerty.transforms.ToTensor
  fields: [emg_left, emg_right]

# Enhanced electrode shift simulation instead of simple band rotation
enhanced_electrode_shift:
  _target_: emg2qwerty.transforms.ForEach  # Apply independently to each band
  transform:
    _target_: emg2qwerty.transforms.EnhancedElectrodeShift
    amp_min: 0.85
    amp_max: 1.15
    correlation_factor: 0.2
    max_channel_shift: 2

temporal_jitter:
  _target_: emg2qwerty.transforms.TemporalAlignmentJitter
  max_offset: 120  # Max 60ms jitter for 2kHz EMG

logspec:
  _target_: emg2qwerty.transforms.LogSpectrogram
  n_fft: 64
  hop_length: 16  # Downsamples from 2kHz to 125Hz

specaug:
  _target_: emg2qwerty.transforms.SpecAugment
  n_time_masks: 3
  time_mask_param: 25  # Max 200ms per time mask for 125Hz spectrogram
  n_freq_masks: 2
  freq_mask_param: 4

transforms:
  train:
    - ${to_tensor}
    - ${enhanced_electrode_shift}  # Using enhanced electrode shift instead of band rotation
    - ${temporal_jitter}
    - ${logspec}
    - ${specaug}

  val:
    - ${to_tensor}
    - ${logspec}

  test: ${transforms.val} 